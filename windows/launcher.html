<style>
:root{font-family:'Segoe UI Variable','Segoe UI','Microsoft YaHei UI',sans-serif;color:#18282d;background:#f6f8f9;font-size:14px;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #56b8aa;outline-offset:4px}button:disabled{cursor:default;opacity:.55}button,article{transition:background .15s,border-color .15s}svg{display:block} .shell{min-height:100vh;display:grid;grid-template-columns:280px 1fr}.side{background:#122d35;color:#e5f0f1;padding:40px 30px;display:flex;flex-direction:column;position:relative;overflow:hidden}.brand{display:flex;gap:12px;align-items:center;font-size:21px;font-weight:650;letter-spacing:-.5px}.logo{width:42px;height:42px;flex-shrink:0}.tag{font-size:11px;letter-spacing:2px;color:#8daeb5;margin-top:36px}.side h1{font-size:31px;line-height:1.5;font-weight:580;letter-spacing:-1px;margin:16px 0}.side p{color:#9bb7bd;line-height:1.9;margin:0;font-size:13px}.branch-art{margin:45px 0 30px;opacity:.85;width:190px;height:150px}.side-footer{margin-top:auto;padding-top:28px}.local{display:flex;align-items:center;gap:8px;color:#bbd3d8;font-size:12px}.dot{width:6px;height:6px;background:#78d6bf;border-radius:50%}.version{color:#6f929b;font-size:11px;margin-top:10px;letter-spacing:.4px}.main{padding:34px 48px 26px;display:flex;flex-direction:column;min-width:0;max-height:100vh}.top{display:flex;justify-content:space-between;align-items:center;color:#839197;font-size:12px}.top .help{border:0;background:none;color:#64747b;padding:8px 0 8px 16px}.top .help:hover{color:#147b6d}.intro{margin-top:49px;margin-bottom:34px}.eyebrow{font-size:12px;font-weight:600;color:#147b6d;margin-bottom:12px}.intro h2{font-size:30px;font-weight:650;letter-spacing:-.8px;margin:0 0 12px}.intro p{margin:0;color:#77868d;line-height:1.8}.projects-heading{display:flex;align-items:center;justify-content:space-between;font-size:13px;color:#6a7a81;margin-bottom:13px}.count{font-size:11px;background:#e9eef0;color:#73848a;border-radius:20px;padding:3px 8px;margin-left:7px}.project-list{overflow:auto;min-height:130px;padding:4px; margin:-4px;flex:1}.project{display:grid;grid-template-columns:46px minmax(0,1fr) 22px;gap:16px;align-items:center;width:100%;background:#fff;border:1px solid #e1e7e9;border-radius:13px;padding:20px;text-align:left;margin:0 0 12px;color:#24383e}.project:hover{border-color:#a5c6bf;background:#fcfefe}.project[aria-pressed=true]{border-color:#399c89;background:#f4fbf8;box-shadow:0 0 0 1px #399c8912}.project .avatar{height:46px;width:46px;border:1px solid #dfe9e5;border-radius:11px;background:#e7f2ed;display:grid;place-items:center;color:#26705d;font-size:20px;font-weight:600}.name{display:block;font-size:16px;font-weight:600;margin-bottom:7px}.path{display:block;font-size:12px;color:#839197;overflow-wrap:anywhere;line-height:1.65;font-family:'Cascadia Code','Consolas','Microsoft YaHei UI',monospace}.check{height:20px;width:20px;border:1px solid #d4dfe1;border-radius:50%;color:transparent;display:grid;place-items:center;font-size:12px}.project[aria-pressed=true] .check{color:white;background:#16806c;border-color:#16806c}.empty{border:1px dashed #d6e0e3;background:#fff;border-radius:14px;padding:42px 22px;text-align:center;color:#798a91;line-height:1.9}.empty strong{display:block;color:#30464d;font-size:17px;margin-bottom:8px}.status{font-size:13px;line-height:1.8;margin:12px 0 0;padding:12px 15px;background:#eaf3f1;border-radius:9px;color:#347969;overflow-wrap:anywhere}.status:empty{display:none}.status.error{background:#fbeeed;color:#ae4b45}.actions{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:24px 0;margin-top:12px}.secondary,.primary{height:44px;border-radius:9px;padding:0 22px;display:inline-flex;align-items:center;justify-content:center;gap:10px;font-size:13px;font-weight:600}.secondary{background:white;color:#425b63;border:1px solid #dce5e8}.secondary:hover{background:#edf3f3}.primary{background:#147d6b;color:white;border:1px solid #147d6b;min-width:155px}.primary:hover{background:#106957}.primary svg{width:16px}.footer{display:flex;align-items:center;gap:8px;border-top:1px solid #e3e9eb;padding-top:18px;color:#97a3a8;font-size:11px;line-height:1.8}.footer svg{width:14px;height:14px;flex-shrink:0}.footer button{margin-left:auto;border:0;background:none;padding:0;color:#7f9097;white-space:nowrap;font-size:11px}.busy .spinner{display:inline-block;width:14px;height:14px;border:2px solid #ffffff60;border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:1000px){.shell{grid-template-columns:235px 1fr}.side{padding:32px 25px}.main{padding:28px 30px}.intro{margin-top:35px}.side h1{font-size:28px}}@media(max-height:650px){.intro{margin-top:24px;margin-bottom:20px}.branch-art{height:90px;margin:20px 0}.side h1{font-size:26px}.actions{padding:16px 0}.main{padding-top:22px}}@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head><body>
<div class="shell"><aside class="side">
<div class="brand"><svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><rect x="1" y="1" width="30" height="30" rx="8" fill="#204550"/><g fill="none" stroke="#8be6dd" stroke-width="2.2" stroke-linecap="round"><path d="M10 11v10m12-10v1a6 6 0 0 1-6 6h-6"/><circle cx="10" cy="8" r="3"/><circle cx="22" cy="8" r="3"/><circle cx="10" cy="24" r="3"/></g></svg>Branch Desk</div>
<div class="tag">你的本地开发工作台</div><h1>每个分支，<br>都有清晰的方向。</h1><p>连接项目、审查差异、管理工作区。<br>让日常开发更有条理。</p>
<svg class="branch-art" viewBox="0 0 190 150" aria-hidden="true"><g fill="none" stroke-width="2"><path d="M34 10v130" stroke="#3d6670"/><path d="M34 117c0-55 115-12 115-67V15" stroke="#67bdac"/><path d="M34 80c0-48 62-12 62-65" stroke="#3d6670"/></g><g stroke="#122d35" stroke-width="5"><circle cx="34" cy="23" r="8" fill="#8be6dd"/><circle cx="34" cy="125" r="8" fill="#8be6dd"/><circle cx="149" cy="23" r="8" fill="#8be6dd"/><circle cx="96" cy="23" r="6" fill="#4c7782"/></g><rect x="70" y="103" width="96" height="29" rx="6" fill="#1b3b44"/><text x="85" y="122" fill="#91bbb8" font-family="Consolas,monospace" font-size="11">git worktree</text></svg>
<div class="side-footer"><div class="local"><span class="dot"></span>在你的电脑上运行</div><div class="version">WINDOWS · 2026.11.10.2</div></div>
</aside><main class="main"><div class="top"><span>工作空间 / 项目</span><button class="help" id="help">使用帮助 ↗</button></div>
<header class="intro"><div class="eyebrow">准备好继续了吗</div><h2>从你的项目开始</h2><p>选择一个本地 Git 项目，进入分支工作台。</p></header>
<div class="projects-heading"><span>本地项目 <span class="count" id="count">0</span></span><span>仅在本机保存</span></div>
<div class="project-list" id="list" aria-label="本地项目"></div><div id="status" class="status" role="status" aria-live="polite">正在读取本地项目…</div>
<div class="actions"><button class="secondary" id="add"><span aria-hidden="true">＋</span> 添加项目</button><button class="primary" id="connect"><span id="button-text">打开工作台</span><span id="button-icon" aria-hidden="true">→</span></button></div>
<footer class="footer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="m12 3 8 3v6c0 5-8 9-8 9s-8-4-8-9V6z"/><path d="m8 12 3 3 5-6"/></svg><span>按需启动后台，关闭窗口后可继续运行。</span><button id="shutdown">关闭空闲后台</button></footer>
</main></div>
<script>
const $=id=>document.getElementById(id);let state={projects:[],busy:true,selectedId:null};
const send=(action,extra={})=>window.chrome.webview.postMessage({action,...extra});
function render(s){const focus=document.activeElement?.dataset?.id;state=s;document.body.classList.toggle('busy',s.busy);$('count').textContent=s.projects.length;$('list').replaceChildren();
 if(!s.projects.length){const empty=document.createElement('div');empty.className='empty';const title=document.createElement('strong');title.textContent='把第一个项目放进来';const desc=document.createElement('div');desc.textContent='添加已经克隆到本机的 Git 仓库，开始管理分支。';empty.append(title,desc);$('list').append(empty)}
 for(const p of s.projects){const card=document.createElement('button');card.className='project';card.dataset.id=p.id;card.disabled=s.busy;card.setAttribute('aria-pressed',String(p.id===s.selectedId));const avatar=document.createElement('span');avatar.className='avatar';avatar.textContent=p.name.slice(0,1).toUpperCase();const body=document.createElement('span');const name=document.createElement('span');name.className='name';name.textContent=p.name;const path=document.createElement('span');path.className='path';path.textContent=p.path;const check=document.createElement('span');check.className='check';check.textContent='✓';check.setAttribute('aria-hidden','true');body.append(name,path);card.append(avatar,body,check);card.onclick=()=>send('select',{id:p.id});card.ondblclick=()=>{send('select',{id:p.id});send('connect')};$('list').append(card);if(p.id===focus)card.focus()}
 $('status').textContent=s.message||'';$('status').classList.toggle('error',s.error);$('status').setAttribute('role',s.error?'alert':'status');$('connect').disabled=s.busy||!s.selectedId;$('add').disabled=s.busy;$('shutdown').disabled=s.busy;$('button-text').textContent=s.busy?'请稍候…':'打开工作台';$('button-icon').className=s.busy?'spinner':'';$('button-icon').textContent=s.busy?'':'→';}
$('connect').onclick=()=>send('connect');$('add').onclick=()=>send('add');$('help').onclick=()=>send('help');$('shutdown').onclick=()=>send('shutdown');window.chrome.webview.addEventListener('message',e=>{if(e.data.type==='state')render(e.data)});send('ready');
</script></body></html>
